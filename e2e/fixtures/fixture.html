<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture</title>
  </head>
  <body>
    <h1>Fixture</h1>
    <form id="main-form">
      <label for="name">Full name</label>
      <input id="name" name="fullname" type="text" />

      <label for="first-name">First name</label>
      <input id="first-name" name="first_name" type="text" />

      <label for="last-name">Last name</label>
      <input id="last-name" name="last_name" type="text" />

      <label for="username">Username</label>
      <input id="username" name="username" type="text" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" />

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password" />

      <label for="phone">Telephone</label>
      <input id="phone" name="phone" type="tel" />

      <label for="quantity">Quantity (5 to 20)</label>
      <input id="quantity" name="quantity" type="number" min="5" max="20" />

      <label for="range">Range</label>
      <input id="range" name="range" type="range" min="0" max="100" />

      <label for="start-date">Start date (2020)</label>
      <input id="start-date" name="start_date" type="date" min="2020-01-01" max="2020-12-31" />

      <label for="time">Time</label>
      <input id="time" name="time" type="time" />

      <label for="website">Website</label>
      <input id="website" name="website" type="url" />

      <label for="color">Favourite colour</label>
      <input id="color" name="color" type="color" />

      <label for="search">Search</label>
      <input id="search" name="search" type="search" />

      <label for="notes">Notes (max 5 characters)</label>
      <textarea id="notes" name="notes" maxlength="5"></textarea>

      <label for="agree">
        <input id="agree" name="agree_terms" type="checkbox" />
        I agree to the terms
      </label>

      <label for="newsletter">
        <input id="newsletter" name="newsletter" type="checkbox" />
        Subscribe to the newsletter
      </label>

      <fieldset>
        <legend>Choice</legend>
        <label><input id="radio-a" name="choice" type="radio" value="alpha" /> Alpha</label>
        <label><input id="radio-b" name="choice" type="radio" value="beta" /> Beta</label>
      </fieldset>

      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="" disabled>Select a country</option>
        <option value="us">United States</option>
        <option value="pt">Portugal</option>
        <option value="de">Germany</option>
      </select>

      <label for="languages">Languages</label>
      <select id="languages" name="languages" multiple>
        <option value="en">English</option>
        <option value="pt">Portuguese</option>
        <option value="es">Spanish</option>
      </select>

      <label for="bio">Bio</label>
      <div id="bio" name="bio" contenteditable="true"></div>

      <input id="disabled" name="disabled_field" type="text" disabled />
      <input id="readonly" name="readonly_field" type="text" readonly value="preset" />
      <input id="hidden-field" name="hidden_field" type="text" style="display: none" />
      <input id="upload" name="upload" type="file" />
      <button id="button" type="button">Do not fill</button>
    </form>
  </body>
</html>
